<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>面試服務</title>
<style>
:root{--bg:#eef1ee;--ink:#17231f;--mut:#5d6b65;--card:#fff;--line:#cfd8d3;--main:#0e5a47;--main2:#0a3f32;--ok:#1f7a3d;--no:#b3261e;--warn:#b26a00}
@media (prefers-color-scheme:dark){:root{--bg:#111a17;--ink:#e8efeb;--mut:#9aaba3;--card:#1a2622;--line:#2f413a;--main:#3fb58f;--main2:#2c8a6b}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"PingFang HK","Noto Sans HK","Microsoft JhengHei",system-ui,sans-serif;font-size:20px}
.screen{display:none;min-height:100%;padding:max(24px,env(safe-area-inset-top)) 40px 40px;flex-direction:column;align-items:center;justify-content:center;gap:24px}
.screen.on{display:flex}
h1{font-size:44px;margin:0;letter-spacing:.06em}
h2{font-size:32px;margin:0}
p{margin:0;color:var(--mut)}
.btn{font:inherit;font-weight:700;border:0;border-radius:16px;padding:22px 44px;min-width:220px;background:var(--main);color:#fff;font-size:26px;cursor:pointer}
.btn:active{transform:scale(.98)}
.btn:disabled{background:var(--line);color:var(--mut)}
.btn.ghost{background:transparent;color:var(--main);border:2px solid var(--main)}
.btn.ok{background:var(--ok)}.btn.no{background:var(--no)}
.big{width:min(100%,760px);display:flex;flex-direction:column;gap:18px}
label{display:flex;flex-direction:column;gap:8px;font-weight:600}
input,textarea{font:inherit;font-size:26px;padding:16px 18px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:100%}
input:focus,textarea:focus{outline:3px solid var(--main);border-color:var(--main)}
.err{color:var(--no);font-size:18px;min-height:22px;font-weight:600}
.row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 28px;width:min(100%,760px)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:10px 16px;font-size:26px}
.kv span:nth-child(odd){color:var(--mut);font-size:20px;align-self:center}
.kv span:nth-child(even){font-weight:700;word-break:break-all}
.pick{display:flex;gap:28px;flex-wrap:wrap;justify-content:center}
.pick .btn{min-width:300px;padding:48px 40px;font-size:34px}
#lockMark{position:fixed;top:0;right:0;width:70px;height:70px;z-index:5}
.stars{display:flex;gap:8px}
.stars button{font:inherit;font-size:24px;width:56px;height:56px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.stars button.s{background:var(--main);border-color:var(--main);color:#fff}
.score{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0}
#reader{width:min(100%,560px);border-radius:16px;overflow:hidden;background:#000}
.tag{display:inline-block;border-radius:999px;padding:4px 16px;font-size:18px;font-weight:700;color:#fff;background:var(--warn)}
.tag.ok{background:var(--ok)}.tag.no{background:var(--no)}
#sheet{display:none}
@media print{
 body>*:not(#sheet){display:none!important}
 #sheet{display:block;background:#fff;color:#000;padding:10mm;font-size:14pt}
 #sheet h1{font-size:22pt;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:12px;letter-spacing:.04em}
 #sheet table{width:100%;border-collapse:collapse;margin:10px 0}
 #sheet td{border:1px solid #000;padding:8px 10px}
 #sheet td:first-child{width:32%;background:#eee}
 #sheet .qr{display:flex;align-items:center;gap:16px;margin-top:14px}
 #sheet .qr svg{width:42mm;height:42mm}
}
</style>
</head>
<body>
<div id="lockMark"></div>

<!-- 1. 選擇裝置 -->
<section class="screen" id="sPick">
  <h1>面試服務</h1>
  <p>請選擇這部 iPad 的用途（選定後會鎖定）</p>
  <div class="pick">
    <button class="btn" data-mode="kiosk">iPad 1<br><small>自助登記及列印</small></button>
    <button class="btn" data-mode="reader">iPad 2<br><small>面試官評分</small></button>
  </div>
</section>

<!-- PIN -->
<section class="screen" id="sPin">
  <h2 id="pinTitle">請輸入密碼</h2>
  <div class="big"><input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="密碼" style="text-align:center;letter-spacing:.4em">
  <div class="err" id="pinErr"></div></div>
  <div class="row"><button class="btn ghost" id="pinCancel">返回</button><button class="btn" id="pinOk">確定</button></div>
</section>

<!-- Kiosk -->
<section class="screen" id="kWelcome">
  <h1>歡迎參加面試</h1>
  <p>請先登記資料，系統會列印面試表格給你</p>
  <button class="btn" id="kStart" style="font-size:40px;padding:44px 90px">開始登記</button>
</section>

<section class="screen" id="kForm">
  <h2>請填寫個人資料</h2>
  <div class="big">
    <label>中文姓名<input id="fCn" autocomplete="off" placeholder="例：陳大文"></label>
    <label>英文姓名<input id="fEn" autocomplete="off" autocapitalize="characters" placeholder="例：CHAN TAI MAN"></label>
    <label>電話號碼<input id="fTel" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="8 位數字"></label>
    <div class="err" id="fErr"></div>
  </div>
  <div class="row"><button class="btn ghost" id="fBack">返回</button><button class="btn" id="fNext">繼續</button></div>
</section>

<section class="screen" id="kConfirm">
  <h2>請核對資料</h2>
  <div class="card"><div class="kv" id="cData"></div></div>
  <p id="cHint">請檢查資料是否正確</p>
  <div class="row"><button class="btn ghost" id="cBack">修改</button><button class="btn" id="cPrint" disabled>列印</button></div>
</section>

<section class="screen" id="kDone">
  <h1>列印中…</h1>
  <p>請取走表格，交給面試官</p>
  <p id="dErr" class="err"></p>
  <button class="btn" id="dOk">完成</button>
</section>

<!-- Reader -->
<section class="screen" id="rScan">
  <h2>掃描申請人表格上的二維碼</h2>
  <div id="reader"></div>
  <div class="big"><div class="err" id="rErr"></div>
  <label>找不到二維碼？輸入表格編號<input id="rManual" autocomplete="off" autocapitalize="off"></label></div>
  <button class="btn ghost" id="rManualGo">讀取</button>
</section>

<section class="screen" id="rView" style="justify-content:flex-start">
  <div class="card"><div class="row" style="justify-content:space-between;align-items:center"><h2>申請人資料</h2><span class="tag" id="vTag">待評核</span></div>
    <div class="kv" id="vData" style="margin-top:16px"></div></div>
  <div class="card">
    <h2 style="font-size:26px">面試評價</h2>
    <div id="scores"></div>
    <label style="margin-top:12px">評語<textarea id="vNote" rows="4" placeholder="輸入面試評語"></textarea></label>
  </div>
  <div class="err" id="vErr"></div>
  <div class="row">
    <button class="btn ghost" id="vBack">掃描下一位</button>
    <button class="btn no" id="vNo">不獲批</button>
    <button class="btn ok" id="vYes">獲批</button>
  </div>
</section>

<!-- 列印用表格 -->
<div id="sheet"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
/* ===== 設定：請改成你自己的 Firebase 專案資料及密碼 ===== */
const CONFIG = {
  PIN: "1234",   // 解鎖密碼（請更改）
  firebase: {
    apiKey: "AIzaSyAHo10BgAvUSRGJFWPKlLI8N9w0KsqdCkk",
    authDomain: "interview-32dbe.firebaseapp.com",
    databaseURL: "https://interview-32dbe-default-rtdb.firebaseio.com",
    projectId: "interview-32dbe",
    storageBucket: "interview-32dbe.firebasestorage.app",
    messagingSenderId: "403238014045",
    appId: "1:403238014045:web:9c1d9c588b2f46930e91b4"
  }
};
/* ======================================================= */

const $ = id => document.getElementById(id);
const show = id => { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db = null;
try { firebase.initializeApp(CONFIG.firebase); db = firebase.database(); } catch (e) { console.error(e); }

const store = {
  get(){ try { return localStorage.getItem('ivMode'); } catch(e){ return null; } },
  set(v){ try { localStorage.setItem('ivMode', v); } catch(e){} },
  del(){ try { localStorage.removeItem('ivMode'); } catch(e){} }
};

/* ---------- 啟動 / 鎖定 ---------- */
let pinAction = null;
function askPin(title, onOk, onCancel){
  $('pinTitle').textContent = title; $('pin').value = ''; $('pinErr').textContent = '';
  pinAction = {onOk, onCancel}; show('sPin'); setTimeout(() => $('pin').focus(), 50);
}
$('pinOk').onclick = () => {
  if ($('pin').value === CONFIG.PIN) { const a = pinAction; pinAction = null; a.onOk(); }
  else { $('pinErr').textContent = '密碼不正確，請再試一次'; $('pin').value = ''; }
};
$('pin').onkeydown = e => { if (e.key === 'Enter') $('pinOk').click(); };
$('pinCancel').onclick = () => pinAction.onCancel();

document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
  const m = b.dataset.mode;
  askPin('請輸入密碼以鎖定為 ' + (m === 'kiosk' ? 'iPad 1' : 'iPad 2'), () => { store.set(m); boot(); }, () => show('sPick'));
});

// 連按右上角 5 次 → 輸入密碼 → 解除鎖定
let taps = 0, tapTimer;
$('lockMark').onclick = () => {
  taps++; clearTimeout(tapTimer); tapTimer = setTimeout(() => taps = 0, 2000);
  if (taps >= 5) { taps = 0; askPin('輸入密碼以解除鎖定', () => { stopScan(); store.del(); show('sPick'); }, boot); }
};

function boot(){
  const m = store.get();
  if (m === 'kiosk') { resetKiosk(); show('kWelcome'); }
  else if (m === 'reader') { startScan(); }
  else show('sPick');
}

/* ---------- iPad 1：自助登記 ---------- */
let rec = null;
function resetKiosk(){ ['fCn','fEn','fTel'].forEach(i => $(i).value = ''); $('fErr').textContent = ''; rec = null; }

$('kStart').onclick = () => show('kForm');
$('fBack').onclick = () => show('kWelcome');
$('fNext').onclick = () => {
  const cn = $('fCn').value.trim(), en = $('fEn').value.trim().toUpperCase(),
        tel = $('fTel').value.replace(/\D/g, '');
  const e = $('fErr');
  if (!/^[\u3400-\u9fff·．\s]{2,10}$/.test(cn)) return e.textContent = '請輸入中文姓名';
  if (!/^[A-Z][A-Z\s,.'-]{1,48}$/.test(en)) return e.textContent = '請輸入英文姓名（英文字母）';
  if (!/^[2-9]\d{7}$/.test(tel)) return e.textContent = '請輸入 8 位香港電話號碼';
  e.textContent = '';
  rec = {cn, en, tel};
  $('cData').innerHTML = [['中文姓名', cn], ['英文姓名', en], ['電話', tel]]
    .map(([k, v]) => `<span>${k}</span><span>${esc(v)}</span>`).join('');
  show('kConfirm'); countdown();
};
$('cBack').onclick = () => { clearInterval(cdT); show('kForm'); };

let cdT;
function countdown(){
  let n = 3; const b = $('cPrint'); b.disabled = true; b.textContent = '列印（' + n + '）';
  clearInterval(cdT);
  cdT = setInterval(() => {
    n--; if (n > 0) b.textContent = '列印（' + n + '）';
    else { clearInterval(cdT); b.disabled = false; b.textContent = '列印'; }
  }, 1000);
}

$('cPrint').onclick = async () => {
  $('cPrint').disabled = true; $('dErr').textContent = '';
  try {
    if (!db) throw new Error('Firebase 未設定');
    const key = db.ref('interviews').push().key;
    const data = {...rec, status: 'pending', createdAt: firebase.database.ServerValue.TIMESTAMP};
    await db.ref('interviews/' + key).set(data);
    printSheet(key, rec);
    show('kDone');
    setTimeout(() => window.print(), 300);
  } catch (e) {
    show('kDone'); $('dErr').textContent = '未能儲存資料，請通知職員（' + e.message + '）';
  }
};
$('dOk').onclick = () => { resetKiosk(); show('kWelcome'); };

function printSheet(id, r){
  const q = qrcode(0, 'M'); q.addData(id); q.make();
  const d = new Date();
  $('sheet').innerHTML = `<h1>面試資料表</h1>
   <table><tr><td>中文姓名</td><td>${esc(r.cn)}</td></tr>
   <tr><td>英文姓名</td><td>${esc(r.en)}</td></tr>
   <tr><td>電話</td><td>${esc(r.tel)}</td></tr>
   <tr><td>登記時間</td><td>${d.toLocaleString('zh-HK', {hour12:false})}</td></tr></table>
   <div class="qr">${q.createSvgTag({cellSize: 6, margin: 0, scalable: true})}
   <div>請交給面試官掃描此二維碼<br><small>編號：${esc(id)}</small></div></div>`;
}

/* ---------- iPad 2：面試官 ---------- */
let scanner = null, curId = null, unsub = null, scores = {};
const CRITERIA = ['溝通表達', '專業知識', '工作態度', '整體印象'];

async function startScan(){
  show('rScan'); $('rErr').textContent = '';
  try {
    if (!scanner) scanner = new Html5Qrcode('reader');
    await scanner.start({facingMode: 'environment'}, {fps: 10, qrbox: 240}, txt => load(txt.trim()));
  } catch (e) { $('rErr').textContent = '未能開啟相機，請允許相機權限，或手動輸入編號'; }
}
async function stopScan(){ try { if (scanner && scanner.isScanning) await scanner.stop(); } catch(e){} }
$('rManualGo').onclick = () => { const v = $('rManual').value.trim(); if (v) load(v); };

async function load(id){
  if (!/^[-\w]{10,40}$/.test(id)) { $('rErr').textContent = '二維碼無效'; return; }
  await stopScan();
  if (unsub) unsub();
  curId = id; scores = {}; $('vNote').value = ''; $('vErr').textContent = '';
  let first = true;
  const ref = db.ref('interviews/' + id);
  const cb = ref.on('value', snap => {
    const r = snap.val();
    if (!r) { $('rErr').textContent = '找不到此表格資料'; startScan(); return; }
    $('vData').innerHTML = [['中文姓名', r.cn], ['英文姓名', r.en], ['電話', r.tel]]
      .map(([k, v]) => `<span>${k}</span><span>${esc(v)}</span>`).join('');
    const t = $('vTag'); t.className = 'tag' + (r.status === 'approved' ? ' ok' : r.status === 'rejected' ? ' no' : '');
    t.textContent = r.status === 'approved' ? '已獲批' : r.status === 'rejected' ? '不獲批' : '待評核';
    if (first) { first = false; if (r.scores) scores = r.scores; if (r.note) $('vNote').value = r.note; drawScores(); show('rView'); }
  });
  unsub = () => ref.off('value', cb);
}

function drawScores(){
  $('scores').innerHTML = '';
  CRITERIA.forEach(c => {
    const row = document.createElement('div'); row.className = 'score';
    row.innerHTML = `<span>${c}</span><div class="stars"></div>`;
    const box = row.querySelector('.stars');
    for (let i = 1; i <= 5; i++) {
      const b = document.createElement('button'); b.textContent = i;
      if (scores[c] === i) b.className = 's';
      b.onclick = () => { scores[c] = i; box.querySelectorAll('button').forEach((x, j) => x.className = j + 1 === i ? 's' : ''); };
      box.appendChild(b);
    }
    $('scores').appendChild(row);
  });
}

async function decide(status){
  const e = $('vErr');
  if (CRITERIA.some(c => !scores[c])) return e.textContent = '請先為每個項目評分（1–5）';
  if (!$('vNote').value.trim()) return e.textContent = '請填寫評語';
  e.textContent = '';
  try {
    await db.ref('interviews/' + curId).update({
      scores, note: $('vNote').value.trim(), status, decidedAt: firebase.database.ServerValue.TIMESTAMP
    });
    e.textContent = '';
    back();
  } catch (x) { e.textContent = '儲存失敗：' + x.message; }
}
$('vYes').onclick = () => decide('approved');
$('vNo').onclick = () => decide('rejected');
function back(){ if (unsub) unsub(); unsub = null; curId = null; $('rManual').value = ''; startScan(); }
$('vBack').onclick = back;

boot();
</script>
</body>
</html>
